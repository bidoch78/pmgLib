[platformio]

[env:esp32dev]
board = esp32-s3-devkitc-1
platform = espressif32
framework = arduino
test_framework = unity

[env:native]
platform = native
test_framework = unity
test_build_src = yes

build_src_filter =
    +<*>
    -<pmgWebSocket.cpp>
    
build_unflags =
    -std=gnu++11
    -std=gnu++14

build_flags =
    -std=c++17